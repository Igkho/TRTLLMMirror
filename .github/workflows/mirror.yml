name: Mirror TensorRT-LLM (x64 & Jetson ARM64)

on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: "Target platform to mirror"
        required: true
        default: "x64-1.3.0"
        type: choice
        options:
          - "x64-1.3.0"
          - "x64-1.4.0rc2"
          - "jetson-r36.4.0"

jobs:
  mirror-image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Free up runner disk space (~30 GB freed for 16 GB TRT-LLM images)
        run: |
          echo "Clearing runner disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          df -h

      - name: Set up QEMU / Buildx for multi-arch pulls (Jetson arm64)
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Upstream Image and Push to GHCR
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          CHOICE="${{ inputs.target_platform }}"

          if [ "$CHOICE" = "x64-1.3.0" ]; then
            SRC_IMAGE="nvcr.io/nvidia/tensorrt-llm/release:1.3.0"
            DST_IMAGE="ghcr.io/$OWNER/tensorrt-llm:1.3.0"
            PLATFORM="linux/amd64"
          elif [ "$CHOICE" = "x64-1.4.0rc2" ]; then
            SRC_IMAGE="nvcr.io/nvidia/tensorrt-llm/release:1.4.0rc2"
            DST_IMAGE="ghcr.io/$OWNER/tensorrt-llm:1.4.0rc2"
            PLATFORM="linux/amd64"
          elif [ "$CHOICE" = "jetson-r36.4.0" ]; then
            SRC_IMAGE="dustynv/tensorrt_llm:0.12-r36.4.0"
            DST_IMAGE="ghcr.io/$OWNER/tensorrt-llm:0.12-r36.4.0-jetson"
            PLATFORM="linux/arm64"
          fi

          echo "Pulling $SRC_IMAGE ($PLATFORM)..."
          docker pull --platform=$PLATFORM $SRC_IMAGE
          docker tag $SRC_IMAGE $DST_IMAGE
          echo "Pushing $DST_IMAGE..."
          docker push $DST_IMAGE