name: Mirror TensorRT-LLM
on: [workflow_dispatch]
jobs:
  mirror-image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Free up runner disk space
        run: |
          echo "Clearing space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h
          
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Pull from NGC and Push to GHCR
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker pull nvcr.io/nvidia/tensorrt-llm/release:1.2.0
          docker tag nvcr.io/nvidia/tensorrt-llm/release:1.2.0 ghcr.io/$OWNER/tensorrt-llm:1.2.0
          docker push ghcr.io/$OWNER/tensorrt-llm:1.2.0